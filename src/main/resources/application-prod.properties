

logging.level.com.jvmd.digitalurpaq_ai_agent=INFO
logging.level.org.springframework=WARN


management.endpoint.health.show-details=when_authorized
management.endpoints.web.exposure.include=health,info,metrics,prometheus


app.rate-limit.requests-per-minute=20


springdoc.swagger-ui.enabled=false


resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=40
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=60s
