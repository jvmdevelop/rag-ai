spring.application.name=digitalurpaq_ai_agent

llm7.api.base-url=${LLM7_API_BASE_URL:https://api.llm7.io/v1}
llm7.api.key=${LLM7_API_KEY:your_llm7_api_key_here}
llm7.api.model=${LLM7_API_MODEL:bidara}

spring.main.allow-bean-definition-overriding=true

pdfPath=${PDF_PATH:raspisanie.pdf}
isInit=${IS_INIT:false}
useChunking=${USE_CHUNKING:true}

frontend.url=${FRONTEND_URL:localhost:3000}
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

spring.http.client.connect-timeout=30s
spring.http.client.read-timeout=120s

app.s3.enabled=${APP_S3_ENABLED:true}
app.s3.endpoint=${APP_S3_ENDPOINT:https://gateway.storjshare.io}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.access-key=${APP_S3_ACCESS_KEY:your_s3_access_key_here}
app.s3.secret-key=${APP_S3_SECRET_KEY:your_s3_secret_key_here}
app.s3.bucket=${APP_S3_BUCKET:rag}
