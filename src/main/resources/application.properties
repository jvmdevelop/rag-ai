spring.application.name=digitalurpaq_ai_agent
spring.main.allow-bean-definition-overriding=true
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}


llm7.api.base-url=${LLM7_API_BASE_URL:https://api.llm7.io/v1}
llm7.api.key=${LLM7_API_KEY:your_llm7_api_key_here}
llm7.api.model=${LLM7_API_MODEL:bidara}
llm7.api.temperature=${LLM7_TEMPERATURE:0.7}
llm7.api.max-tokens=${LLM7_MAX_TOKENS:500}
llm7.api.timeout-seconds=${LLM7_TIMEOUT:60}


app.frontend-url=${FRONTEND_URL:localhost:3000}
app.pdf-path=${PDF_PATH:raspisanie.pdf}
app.init=${IS_INIT:false}
app.use-chunking=${USE_CHUNKING:true}
app.rate-limit.requests-per-minute=${RATE_LIMIT_RPM:20}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW:60}


app.rag.top-k=5
app.rag.max-retries=2
app.rag.pipeline-timeout=30s
app.rag.max-context-length=4000
app.rag.search-cache-ttl=30m
app.rag.query-cache-ttl=60m
app.rag.max-cache-size=1000
app.rag.chunk-size=500
app.rag.chunk-overlap=100


app.s3.enabled=${APP_S3_ENABLED:true}
app.s3.endpoint=${APP_S3_ENDPOINT:https://gateway.storjshare.io}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.access-key=${APP_S3_ACCESS_KEY:your_s3_access_key_here}
app.s3.secret-key=${APP_S3_SECRET_KEY:your_s3_secret_key_here}
app.s3.bucket=${APP_S3_BUCKET:rag}


spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}


spring.http.client.connect-timeout=30s
spring.http.client.read-timeout=120s


management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.health.elasticsearch.enabled=true
management.metrics.tags.application=${spring.application.name}


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.show-actuator=true


resilience4j.circuitbreaker.instances.llm.sliding-window-size=10
resilience4j.circuitbreaker.instances.llm.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llm.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llm.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llm.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.llm.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.llm.slow-call-rate-threshold=80


server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
