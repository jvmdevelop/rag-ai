spring.application.name=digitalurpaq_ai_agent

# ── Java 21 Virtual Threads ───────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ── Graceful Shutdown (Senior must-have) ──────────────────────────────────────
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# ── LLM7.io API (OpenAI-compatible) ──────────────────────────────────────────
llm7.api.base-url=https://api.llm7.io/v1
llm7.api.key=IAG9Vq6z4FGdKTqoQsXUPNn19+x1Mc/53vCe32qCkWo3473+tkOA895EOkRcVHgEj2dAmP3mUNHDVJB3Xs5PNqAoMZGzpR4c5sqzfQtFyghZzPVUW+VVq7727ofrKQL+g/g=
llm7.api.model=bidara

# ── LangChain4j — disable autoconfigure, we configure manually ───────────────
langchain4j.open-ai.chat-model.enabled=false

# ── Spring Boot Core ──────────────────────────────────────────────────────────
spring.main.allow-bean-definition-overriding=true

# ── Elasticsearch ─────────────────────────────────────────────────────────────
spring.elasticsearch.uris=http://localhost:9200

# ── HTTP Client Timeouts ──────────────────────────────────────────────────────
spring.http.client.connect-timeout=30s
spring.http.client.read-timeout=120s

# ── Document Ingestion ────────────────────────────────────────────────────────
pdfPath=raspisanie.pdf
isInit=false
useChunking=true

# ── Frontend CORS ─────────────────────────────────────────────────────────────
frontend.url=localhost:3000

# ─────────────────────────────────────────────────────────────────────────────
# SPRING BOOT ACTUATOR — Production-ready monitoring
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info,loggers,env,prometheus,caches,scheduledtasks
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,elasticsearch,fileStore
management.endpoint.loggers.enabled=true
management.endpoint.caches.enabled=true
management.info.build.enabled=true
management.info.git.mode=simple
management.info.env.enabled=true
management.metrics.export.prometheus.enabled=true
management.observations.annotations.enabled=true

# App info (exposed via /actuator/info)
info.app.name=Digital Urpaq AI Agent
info.app.description=RAG-based AI assistant for Digital Urpaq Children's Palace
info.app.team=Digital Urpaq
info.app.version=0.0.1

# ─────────────────────────────────────────────────────────────────────────────
# SPRING CACHE — Caffeine L1 hot cache (on top of FileContextStore L2)
# ─────────────────────────────────────────────────────────────────────────────
spring.cache.type=caffeine
spring.cache.cache-names=searchCache,queryCache,responseCache
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=10m,recordStats

# ─────────────────────────────────────────────────────────────────────────────
# FILE-BASED CONTEXT STORAGE (L2 persistent cache)
# ─────────────────────────────────────────────────────────────────────────────
app.storage.base-dir=./data
app.storage.search-ttl-minutes=30
app.storage.query-ttl-minutes=60
app.storage.response-ttl-minutes=120
app.storage.max-entries-per-namespace=500
app.storage.eviction-interval-ms=900000

# ─────────────────────────────────────────────────────────────────────────────
# SESSION MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────────
app.session.max-messages=20
app.session.ttl-hours=24

# ─────────────────────────────────────────────────────────────────────────────
# FEATURE FLAGS (@ConditionalOnProperty)
# ─────────────────────────────────────────────────────────────────────────────
app.reranker.enabled=true
app.s3.enabled=${APP_S3_ENABLED:true}

# ─────────────────────────────────────────────────────────────────────────────
# S3 STORAGE (Storj)
# ─────────────────────────────────────────────────────────────────────────────
app.s3.endpoint=${APP_S3_ENDPOINT:https://gateway.storjshare.io}
app.s3.region=${APP_S3_REGION:us-east-1}
app.s3.access-key=${APP_S3_ACCESS_KEY:jwwtobin2x73jcpe32f6zn3va33a}
app.s3.secret-key=${APP_S3_SECRET_KEY:j2s7pvm7lzl5hy7sl2zcgo5vheop42m7qqef4su5eawrw4pd6vl66}
app.s3.bucket=${APP_S3_BUCKET:rag}

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING — Structured format
# ─────────────────────────────────────────────────────────────────────────────
logging.level.com.jvmd.digitalurpaq_ai_agent=INFO
logging.level.com.jvmd.digitalurpaq_ai_agent.service.rag=DEBUG
logging.level.org.springframework.cache=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-}] %logger{36} - %msg%n
