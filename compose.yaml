services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${APP_S3_BUCKET:-rag};
        mc anonymous set download local/${APP_S3_BUCKET:-rag};
      "
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalurpaq-ai-agent
    depends_on:
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - APP_S3_ENABLED=true
      - APP_S3_ENDPOINT=http://minio:9000
      - APP_S3_REGION=${APP_S3_REGION:-us-east-1}
      - APP_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - APP_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - APP_S3_BUCKET=${APP_S3_BUCKET:-rag}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  es-data:
  minio-data:
  app-data:

networks:
  app-network:
    driver: bridge
